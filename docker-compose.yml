services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: civicpulse-api
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=sqlite:///./civicpulse.db
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - ./civicpulse.db:/app/civicpulse.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: civicpulse-client
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: civicpulse-network
